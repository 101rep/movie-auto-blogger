<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - SUPER AUTO BLOGGER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="container p-3">
    <div class="card login-card mx-auto border-0">
      <div class="card-header bg-dark text-white text-center py-4 border-0">
        <h3 class="fw-bold mb-1"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>SUPER AUTO BLOGGER</h3>
        <p class="text-muted small mb-0">관리자 인증이 필요합니다</p>
      </div>
      <div class="card-body p-4 bg-white">
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show small" role="alert">
          <i class="bi bi-exclamation-circle-fill me-1"></i> {{ error }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">
          {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
          {% endif %}
          <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">관리자 아이디</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username" placeholder="아이디 입력" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small fw-semibold text-secondary">비밀번호</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호 입력" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> 로그인
          </button>
        </form>
      </div>
      <div class="card-footer bg-light text-center py-3 border-0 small text-muted">
        비공개 개인용 자동화 시스템
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
